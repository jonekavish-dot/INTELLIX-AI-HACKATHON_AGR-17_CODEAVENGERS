services:
  - type: web
    name: agridiff-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: 30
      - key: LLM_MAX_CONCURRENT
        value: 5
      - key: GEMINI_API_KEY
        sync: false
